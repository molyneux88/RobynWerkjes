<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Math Fun 🎉</title>

<link rel="stylesheet" href="style.css">

<!-- Playful font -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">

</head>

<body onload="generate()">

<h1>Math Fun 🎉</h1>

<div class="top-bar">

<button onclick="toggleOptions()">⚙ Options</button>
<button onclick="generate()">🔄 New Questions</button>

</div>

<div id="optionsMenu" class="options-menu hidden">

<h3>Operations</h3>

<div class="ops-grid">

<label class="playful">
<input type="checkbox" id="add" checked>
<span class="op-symbol">+</span>
</label>

<label class="playful">
<input type="checkbox" id="sub" checked>
<span class="op-symbol">−</span>
</label>

<label class="playful">
<input type="checkbox" id="mul" checked>
<span class="op-symbol">×</span>
</label>

<label class="playful">
<input type="checkbox" id="div">
<span class="op-symbol">÷</span>
</label>

</div>

<h3>Times Tables</h3>

<div class="tables-grid">

<label><input type="checkbox" class="table" value="2" checked>2</label>
<label><input type="checkbox" class="table" value="3" checked>3</label>
<label><input type="checkbox" class="table" value="4">4</label>
<label><input type="checkbox" class="table" value="5" checked>5</label>
<label><input type="checkbox" class="table" value="6">6</label>
<label><input type="checkbox" class="table" value="7">7</label>
<label><input type="checkbox" class="table" value="8">8</label>
<label><input type="checkbox" class="table" value="9">9</label>
<label><input type="checkbox" class="table" value="10">10</label>
<label><input type="checkbox" class="table" value="11">11</label>
<label><input type="checkbox" class="table" value="12">12</label>

</div>

<h3>Mascot</h3>

<select id="mascotSelect"></select>

<button onclick="resetStars()" class="reset-stars">
Reset Stars
</button>

</div>

<div class="mascot-area">

<div id="mascot">🦊</div>

<div id="mascotMessage">
Let's do some math!
</div>

</div>

<div class="reward-area">

<div>⭐ Stars: <span id="starCount">0</span></div>

<div id="unlockArea"></div>

</div>

<div id="questions"></div>

<button class="check-button" onclick="checkAnswers()">Check Answers</button>

<h2 id="result"></h2>

<script src="script.js"></script>

</body>
</html>
